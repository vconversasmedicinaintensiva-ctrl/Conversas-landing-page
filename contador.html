<!DOCTYPE html>
<html lang="pt-PT">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscrições — V Conversas em Medicina Intensiva</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<style>

:root {
--green: #0E3B33;
--green-dark: #082B24;
--green-soft: #29584C;
--gold: #B38B4D;
--gold-light: #D5B67A;
--cream: #FAF7F2;
--white: #ffffff;
--text: #17332D;
--muted: #6D7C76;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
background: var(--cream);
color: var(--text);
font-family: "Source Sans 3", sans-serif;

display: flex;
align-items: center;
justify-content: center;
}

.page {
width: min(900px, 92vw);
padding: 60px 20px;
text-align: center;
}

.eyebrow {
margin-bottom: 18px;

font-family: "Jost", sans-serif;
font-size: 13px;
font-weight: 600;
letter-spacing: 3px;
text-transform: uppercase;

color: var(--gold);
}

.event-title {
margin: 0;

font-family: "Jost", sans-serif;
font-size: clamp(22px, 4vw, 34px);
font-weight: 600;
letter-spacing: 1px;
text-transform: uppercase;

color: var(--green);
}

.date {
margin-top: 8px;

font-family: "Cormorant Garamond", serif;
font-size: clamp(28px, 5vw, 46px);
font-style: italic;

color: var(--green-soft);
}

.counter-card {
position: relative;

margin-top: 45px;
padding: 55px 30px 45px;

background: var(--white);

border-top: 2px solid var(--gold);

box-shadow:
0 12px 40px rgba(14, 59, 51, 0.10);

overflow: hidden;
}

.counter-card::before {
content: "";

position: absolute;

width: 250px;
height: 250px;

top: -145px;
left: -120px;

border: 1px solid rgba(179, 139, 77, 0.22);

border-radius: 50%;
}

.counter-card::after {
content: "";

position: absolute;

width: 210px;
height: 210px;

right: -100px;
bottom: -120px;

border: 1px solid rgba(179, 139, 77, 0.18);

border-radius: 50%;
}

.counter-label {
position: relative;
z-index: 1;

font-family: "Jost", sans-serif;
font-size: 14px;
font-weight: 600;
letter-spacing: 4px;
text-transform: uppercase;

color: var(--muted);
}

.number {
position: relative;
z-index: 1;

margin-top: 15px;

font-family: "Cormorant Garamond", serif;
font-size: clamp(110px, 20vw, 200px);
font-weight: 600;
line-height: 0.8;

color: var(--green);
}

.participants {
position: relative;
z-index: 1;

margin-top: 25px;

font-family: "Jost", sans-serif;
font-size: 17px;

color: var(--green-soft);
}

.updated {
position: relative;
z-index: 1;

margin-top: 35px;

font-size: 13px;

color: var(--muted);
}

.footer {
margin-top: 35px;

font-family: "Jost", sans-serif;
font-size: 11px;
letter-spacing: 1.5px;
line-height: 1.6;
text-transform: uppercase;

color: var(--muted);
}

.error {
color: #8A3B32;
}

.links {
position: relative;
z-index: 1;

display: flex;
justify-content: center;
gap: 14px;

margin-top: 35px;
}

.links a {
display: inline-block;

padding: 11px 22px;

border: 1px solid var(--gold);

font-family: "Jost", sans-serif;
font-size: 12px;
font-weight: 600;
letter-spacing: 1.5px;
text-transform: uppercase;

text-decoration: none;

color: var(--green);
background: transparent;

transition:
background-color 0.2s ease,
color 0.2s ease;
}

.links a:hover {
background: var(--green);
color: var(--white);
}

@media (max-width: 600px) {

.links {
flex-direction: column;
align-items: center;
gap: 10px;
}

.links a {
width: min(240px, 80vw);
}

}
  
@media (max-width: 600px) {

.page {
padding: 35px 10px;
}

.counter-card {
margin-top: 30px;
padding: 45px 20px 35px;
}

.number {
font-size: 115px;
}

}

</style>
</head>

<body>

<main class="page">

<div class="eyebrow">
V Conversas
</div>

<h1 class="event-title">
Medicina Intensiva
</h1>

<div class="date">
23 de outubro de 2026
</div>

<section class="counter-card">

<div class="counter-label">
Inscrições
</div>

<div
id="count"
class="number">
…
</div>

<div class="participants">
participantes inscritos
</div>

<div
id="updated"
class="updated">
A atualizar…
</div>

</section>

<div class="links">

<a
href="https://tally.so/r/b5XgM6"
target="_blank"
rel="noopener">
Inscrições
</a>

<a
href="https://vconversasmedicinaintensiva-ctrl.github.io/Conversas-landing-page/"
target="_blank"
rel="noopener">
Página do evento
</a>

</div>

<div class="footer">
Serviço de Medicina Intensiva · ULS Região de Aveiro
</div>

</main>

<script>

/*
* URL da aplicação Web do Google Apps Script.
*
* SUBSTITUI o valor abaixo pelo URL /exec
* da aplicação que acabámos de testar.
*/
const API_URL = "https://script.google.com/macros/s/AKfycbzTyVIxL7pckuZyAektFHtDL5CWl_g3mKXRFEV3mrRmCDAmTPy90875Ou-OXbznKoqk/exec?api=count";


async function updateCounter() {

const countElement = document.getElementById("count");
const updatedElement = document.getElementById("updated");

try {

/*
* O Apps Script devolve HTML quando usamos doGet(),
* por isso nesta primeira versão vamos utilizar
* uma função específica que devolverá JSON.
*/

const response = await fetch(API_URL);

if (!response.ok) {
throw new Error("Erro HTTP " + response.status);
}

const data = await response.json();

countElement.textContent =
Number(data.count).toLocaleString("pt-PT");

const now = new Date();

updatedElement.textContent =
"Atualizado às " +
now.toLocaleTimeString("pt-PT", {
hour: "2-digit",
minute: "2-digit"
});

updatedElement.classList.remove("error");

} catch (error) {

console.error(error);

countElement.textContent = "—";

updatedElement.textContent =
"Não foi possível atualizar";

updatedElement.classList.add("error");
}
}


updateCounter();

/*
* Atualização automática a cada 30 segundos.
*/
setInterval(updateCounter, 30000);

</script>

</body>

</html>
